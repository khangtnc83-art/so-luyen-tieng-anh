<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sổ Luyện Tiếng Anh</title>
<meta name="description" content="Ôn ngữ pháp, từ vựng và luyện nói tiếng Anh giao tiếp — Thứ 2 và Thứ 5 hằng tuần.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one calm column (max 860px). Lessons = schedule list; grammar = mindmap grid under a root pill. */
:root{
  --bg:#f4f7f7;--surface:#ffffff;--sunk:#eaf0f0;--fg:#142022;--muted:#596a6d;--line:#d3dddf;
  --accent:#1d6a72;--accent-fg:#ffffff;--accent-soft:#dfeeee;
  --good:#2b7a4b;--good-soft:#e1f1e7;--warn:#9c6410;--warn-soft:#f7ecd8;--bad:#b23a33;--bad-soft:#f7e2e0;--info:#4a55a8;--info-soft:#e8eaf8;
  --b0:#1d6a72;--b0s:#e0eff0;--b1:#a35a12;--b1s:#f8ecdc;--b2:#5b4fb0;--b2s:#ecebf9;--b3:#a83d63;--b3s:#f8e5ec;--b4:#3d7a2f;--b4s:#e6f2e2;
  --font:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e1415;--surface:#152022;--sunk:#1b2729;--fg:#e3ebeb;--muted:#92a3a5;--line:#2b393b;
  --accent:#6bc1c8;--accent-fg:#0a1516;--accent-soft:#1b3335;
  --good:#6ccd94;--good-soft:#152f22;--warn:#e3b05c;--warn-soft:#32271a;--bad:#ef877d;--bad-soft:#3a1e1c;--info:#a3abf3;--info-soft:#22253f;
  --b0:#6bc1c8;--b0s:#173133;--b1:#e8a964;--b1s:#33261a;--b2:#a99ff0;--b2s:#25223f;--b3:#ee8fb2;--b3s:#3a1f2a;--b4:#8fd17c;--b4s:#1c3018;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 72px}
h1,h2,h3{font-weight:500;text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:1.5rem}h2{font-size:1.05rem}h3{font-size:.98rem}
p{margin:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:14px;border-bottom:1px solid var(--line);margin-bottom:24px}
.brand{font-weight:300;font-size:1.05rem;margin-right:auto;cursor:pointer}
.brand b{font-weight:600;color:var(--accent)}
nav{display:flex;gap:4px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;line-height:1.2}
button:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed;border-color:var(--line)}
.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:500}
.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.ghost:hover{color:var(--fg);border-color:var(--line)}
.ghost.on{color:var(--accent);background:var(--accent-soft)}
.small{padding:5px 10px;font-size:.85rem}
.lang{font-family:var(--mono);font-size:.8rem;padding:5px 9px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.section{display:flex;flex-direction:column;gap:12px;margin-top:30px}
.muted{color:var(--muted)}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:500;white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .big{font-size:1.8rem;font-weight:500;font-family:var(--mono);line-height:1.1}
.stat .big small{font-size:.95rem;color:var(--muted)}
.stat span{font-size:.85rem}
.stat.good .big{color:var(--good)}.stat.info .big{color:var(--info)}.stat.bad .big{color:var(--bad)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.item:first-child{border-top:0}
.item .grow{flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:4px}
.item .title{font-weight:500}
.item.today{box-shadow:inset 3px 0 0 var(--accent)}
.item.off .title{color:var(--muted);font-weight:400}
.open{cursor:pointer;border-radius:6px}
.open:hover .title{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.date{display:flex;flex-direction:column;align-items:center;width:52px;flex:none;border-radius:8px;background:var(--sunk);padding:6px 0;line-height:1.1}
.date b{font-family:var(--mono);font-size:1.15rem;font-weight:500}
.date small{font-size:.7rem;color:var(--muted)}
.today .date{background:var(--accent);color:var(--accent-fg)}.today .date small{color:var(--accent-fg)}
.mk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.85rem}
.mk label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--muted)}
.mk input[type=checkbox]{width:16px;height:16px;accent-color:var(--info)}
.mk input[type=date]{width:auto;padding:4px 8px;font-size:.85rem}
.mk .mkd{display:inline-flex;flex-direction:column;gap:2px;align-items:flex-start}
.mk .mkd span{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em}
.mk label:has(input:disabled){opacity:.5;cursor:not-allowed}
.month-h{display:flex;align-items:baseline;gap:10px;margin:22px 0 8px}
.month-h:first-child{margin-top:0}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:24px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.back{margin-bottom:12px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 20px;overflow-x:auto}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;color:var(--muted);padding:10px 12px;white-space:nowrap}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.tabs .ok{color:var(--good);margin-left:6px}
.donebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--sunk);border-radius:var(--r);padding:12px 16px;margin-top:14px;font-size:.9rem}
.donebar.done{background:var(--good-soft)}
.steps{display:flex;gap:6px}
.steps i{width:28px;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--good)}
.seg{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk)}
.seg b{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c);vertical-align:-1px}
/* mindmap */
.mm-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.mm{display:flex;flex-direction:column;align-items:center}
.mm-root{background:var(--fg);color:var(--bg);font-weight:500;padding:12px 22px;border-radius:999px;text-align:center;max-width:100%;position:relative}
.mm-root::after{content:"";position:absolute;left:50%;top:100%;height:20px;border-left:2px solid var(--line)}
.mm-branches{width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,350px),1fr));gap:16px;margin-top:20px;padding-top:20px;position:relative;align-items:start}
.mm-branches::before{content:"";position:absolute;top:0;left:18%;right:18%;border-top:2px solid var(--line)}
.mm-branch{--c:var(--b0);--cs:var(--b0s);position:relative;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:var(--r);padding:14px 14px 12px;min-width:0}
.mm-branch::before{content:"";position:absolute;bottom:100%;left:50%;height:22px;border-left:2px solid var(--line)}
.mm-branch.b1{--c:var(--b1);--cs:var(--b1s)}.mm-branch.b2{--c:var(--b2);--cs:var(--b2s)}.mm-branch.b3{--c:var(--b3);--cs:var(--b3s)}.mm-branch.b4{--c:var(--b4);--cs:var(--b4s)}
.mm-branch>h3{display:flex;align-items:center;gap:8px;color:var(--c);margin-bottom:8px}
.mm-branch>h3 .n{font-family:var(--mono);font-size:.75rem;background:var(--cs);border-radius:6px;padding:1px 7px}
.mm-branch.tipb{border-style:dashed;border-top-style:solid}
@media (max-width:760px){.mm-branches::before,.mm-branch::before{display:none}.mm-root::after{display:none}.mm-branches{margin-top:14px;padding-top:0}}
.tree{list-style:none;margin:0;padding:0 0 0 2px}
.tree .tree{padding-left:14px}
.tree li{position:relative;padding:3px 0 3px 16px}
.tree li::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:1px solid var(--line)}
.tree li:last-child::before{bottom:auto;height:1.05em}
.tree li::after{content:"";position:absolute;left:0;top:1.05em;width:11px;border-top:1px solid var(--line)}
.tree summary{cursor:pointer;list-style:none;display:block}
.tree summary::-webkit-details-marker{display:none}
.tree summary::before{content:"▸";display:inline-block;width:1em;color:var(--c);transition:transform .15s}
.tree details[open]>summary::before{transform:rotate(90deg)}
.tree summary .txt{font-weight:500}
.tree .tip{color:var(--muted);font-size:.88rem}
.tree .tip .tg.fx{background:var(--info-soft);color:var(--info)}
.lesson-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tree .tip .tg{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:0 5px;margin-right:6px;font-weight:600}
.tree b,.mm-branch h3 b{color:var(--c);font-weight:600}
.pair{display:inline-flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.pair .to{color:var(--muted)}
.pair .sfx{color:var(--c);font-weight:600;background:var(--cs);border-radius:3px;padding:0 1px}
.say{border:0;background:transparent;color:var(--muted);padding:0 4px;font-size:.8rem;cursor:pointer}
.say:hover{color:var(--accent)}
.wchip{border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:1px 7px;font-size:.85rem;margin:2px 2px 0 0;color:var(--fg)}
.wchip:hover{border-color:var(--c)}
/* study */
.study{display:flex;flex-direction:column;gap:16px;max-width:580px;margin:0 auto}
.bar{height:4px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--accent);transition:width .3s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:30px 22px;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.card .word{font-size:2rem;font-weight:500;overflow-wrap:anywhere}
.card .ipa{font-family:var(--mono);color:var(--muted)}
.card .vi{font-size:1.15rem}
.card .ex{color:var(--muted);font-style:italic;max-width:44ch}
.card .q{font-size:1.2rem;line-height:1.5;max-width:44ch}
.card{position:relative}
.card .exvi{color:var(--fg);font-size:.92rem;max-width:44ch}
.cstar{position:absolute;top:10px;right:10px}
.star{border:0;background:transparent;color:var(--muted);font-size:1.15rem;line-height:1;padding:3px 5px;border-radius:6px}
.star:hover{color:var(--warn)}
.star.on{color:#d9a400}
.cnav{display:flex;align-items:center;gap:8px;justify-content:space-between}
.vnote,.nbook{width:100%;font:inherit;font-size:.9rem;line-height:1.45;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);color:var(--fg);resize:vertical}
.vnote{min-height:58px}
.nbook{min-height:150px}
.card .vnote{max-width:44ch;text-align:left}
.c-note{display:block;font-size:.82rem;color:var(--accent);margin-top:3px;white-space:pre-line}
.nb{margin-top:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.nb summary{padding:10px 14px;cursor:pointer;font-weight:500}
.nb .nbin{padding:0 14px 14px;display:flex;flex-direction:column;gap:6px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{display:flex;flex-direction:column;gap:2px;align-items:center;padding:10px 4px}
.grades small{font-family:var(--mono);color:var(--muted);font-size:.72rem}
.opts{display:grid;gap:8px}
.opts button{text-align:left;padding:12px 16px}
.opts button.right{background:var(--good-soft);border-color:var(--good);color:var(--fg);opacity:1}
.opts button.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--fg);opacity:1}
.fb{border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.fb.ok{background:var(--good-soft)}.fb.no{background:var(--bad-soft)}
input[type=text],input[type=search],input[type=date],textarea,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%;min-width:0}
textarea{font-family:var(--mono);font-size:.8rem;min-height:90px}
.words{font-size:1.2rem;line-height:1.9}
.words span{padding:1px 3px;border-radius:4px}
.words .hit{background:var(--good-soft);color:var(--good)}
.words .miss{background:var(--bad-soft);color:var(--bad);text-decoration:underline dotted}
.score{font-family:var(--mono);font-size:2.4rem;font-weight:500;line-height:1}
.mic.live{background:var(--bad);border-color:var(--bad);color:#fff}
.lvl1{background:var(--good-soft);color:var(--good)}.lvl2{background:var(--warn-soft);color:var(--warn)}.lvl3{background:var(--bad-soft);color:var(--bad)}
/* vocab */
.vtool{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
@media (max-width:640px){.vtool{grid-template-columns:1fr}}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border-radius:999px;padding:5px 12px;font-size:.85rem}
.filters button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.vgroup{margin-top:18px}
.vgroup h3{display:flex;gap:8px;align-items:baseline;margin-bottom:8px}
.vrow{border-top:1px solid var(--line)}
.vrow:first-child{border-top:0}
.vrow summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.6fr) auto;gap:12px;align-items:center;padding:11px 16px}
.vrow summary::-webkit-details-marker{display:none}
.vrow summary:hover{background:var(--sunk)}
.vrow .w{font-weight:500}
.vrow .f{color:var(--muted);font-size:.88rem}
.vrow .ipa{font-family:var(--mono);color:var(--muted);font-size:.8rem;display:block}
.vrow .mean{min-width:0}
.vrow .more{padding:0 16px 14px;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.vrow .more .ex{font-style:italic}
.dot{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);white-space:nowrap}
.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--line))}
.st-new{--c:var(--line)}.st-learning{--c:var(--warn)}.st-known{--c:var(--good)}
.vrow[open]{background:var(--sunk)}
.chip.pos{font-family:var(--mono);background:var(--accent-soft);color:var(--accent);font-size:.72rem;padding:1px 7px}
.wrap.wide{max-width:1120px}
.vhead,.vrow summary{display:grid;grid-template-columns:minmax(0,1.05fr) 84px minmax(0,1.9fr) minmax(0,1fr) minmax(0,.9fr) 164px;gap:14px;align-items:start}
.vhead{padding:16px 16px 6px}
.vrow summary{padding:12px 16px}
.c-pos{display:flex;flex-wrap:wrap;gap:3px;padding-top:2px}
.c-vi{min-width:0;overflow-wrap:anywhere}
.c-fam,.c-syn{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:.88rem;min-width:0}
.fw i,.sw i{font-style:normal;font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.fw{color:var(--b2)}.sw{color:var(--b1)}
.none{color:var(--line)}
.mlab{display:none}
.c-st{display:flex;justify-content:flex-end;align-items:center;gap:4px;padding-top:1px}
.c-ex{display:block;font-size:.84rem;font-style:italic;color:var(--muted);margin-top:3px}
.wtog{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;white-space:nowrap}
.wtog button{border:0;border-radius:0;background:transparent;color:var(--muted);font-size:.74rem;padding:4px 9px}
.wtog button+button{border-left:1px solid var(--line)}
.wtog button:hover{color:var(--fg)}
.wtog button.rv{background:var(--warn-soft);color:var(--warn);font-weight:600}
.wtog button.kn{background:var(--good-soft);color:var(--good);font-weight:600}
.grades.g2{grid-template-columns:1fr 1fr}
.gr-review span{color:var(--warn)}.gr-known span{color:var(--good)}
.vdl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;margin:0}
.vdl dt{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;padding-top:3px}
.vdl dd{margin:0;min-width:0}
.vdl .wchip{--c:var(--accent)}
.letters{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.letters button{font-family:var(--mono);font-size:.78rem;padding:3px 7px;min-width:28px;border-radius:6px}
.letters button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
@media (max-width:700px){
 .vhead{display:none}
 .vrow summary{grid-template-columns:minmax(0,1fr) auto;gap:6px 12px}
 .c-w{grid-column:1;grid-row:1}.c-st{grid-column:2;grid-row:1}
 .c-pos{grid-column:1/-1;grid-row:2}
 .c-vi{grid-column:1/-1;grid-row:3}
 .c-fam{grid-column:1/-1;grid-row:4}.c-syn{grid-column:1/-1;grid-row:5}
 .mlab{display:inline;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;min-width:92px}
 .c-fam:has(.none),.c-syn:has(.none){display:none}
}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:9px 12px;border-top:1px solid var(--line);white-space:nowrap}
td.wrapc{white-space:normal;min-width:220px}
body.viewing :is([data-act="theoryDone"],[data-act="startQuiz"],[data-act="startSpeak"],[data-act="startCards"],[data-act="wst"]){opacity:.4;cursor:not-allowed;filter:grayscale(1)}
body.viewing [data-act="wst"]:not(.on){visibility:hidden}
.tact{display:flex;gap:6px;align-items:center;justify-content:flex-end}
.danger{color:var(--bad);border-color:var(--bad)}
.danger:hover{background:var(--bad-soft);border-color:var(--bad)}
.asbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;background:var(--info-soft);color:var(--fg);border-radius:var(--r);padding:10px 14px;margin-bottom:18px;font-size:.9rem}
.asbar b{color:var(--info)}

    const pr=r.progress;
    if(pr&&(pr.updatedAt||0)>(P.updatedAt||0)){["theory","quiz","speak","done","vs","star","notes","notebook","updatedAt"].forEach(k=>{if(pr[k]!==undefined)P[k]=pr[k]})}
    else if(!pr||(pr.updatedAt||0)<(P.updatedAt||0)){pushPending=true;pushNow()}

}

/* ---------- schedule ---------- */
function buildSlots(){
  const byDate={};SESS.forEach(s=>{(byDate[s.date]=byDate[s.date]||[]).push(s)});
  const td=today();const lastContent=SESS.length?SESS[SESS.length-1].date:START;
  let end=td>lastContent?td:lastContent;{const e=parseDay(end);end=dayStr(new Date(e.getFullYear(),e.getMonth()+1,0))}let up=0,d=START;const out=[];
  while(d<=end||up<2){
    const wd=parseDay(d).getDay();
    if(DAYS.includes(wd)||byDate[d]){const ls=byDate[d]||[];out.push({date:d,ls,s:ls[0]||null});if(d>td)up++}
    d=dayAdd(d,1);if(out.length>400)break;
  }
  out.forEach((x,i)=>{x.n=i+1;x.key=x.date;x.title=x.ls.map(l=>l.title).join(" + ")});
  return out;
}
let SLOTS=buildSlots();
function partsOf(sid){return[!!P.theory[sid],!!P.quiz[sid],!!P.speak[sid]]}
const slotOf=sid=>SLOTS.find(z=>z.ls.some(l=>l.id===sid));
const slotParts=x=>x.ls.flatMap(l=>partsOf(l.id));
function slotInfo(x){
  const td=today();const done=P.done[x.key];const mk=P.makeup[x.key];const mkOn=!!(mk&&mk.on);
  let st;
  if(done){const ad=dayStr(new Date(done));st=mkOn?"makeup":ad===x.date?"ontime":"late"}
  else if(mkOn)st="makeup";
  else if(mk&&mk.date)st="planned";
  else if(!x.s)st=x.date>td?"upcoming":"nocontent";
  else if(x.date>td)st="upcoming";
  else if(x.date===td)st="today";
  else st="missed";
  const counted=!!done||mkOn;
  const actual=mkOn&&mk.date?mk.date:done?dayStr(new Date(done)):null;
  return{st,counted,done,mk,mkOn,actual};
}
const ST_CHIP={planned:"warn",upcoming:"",today:"acc",ontime:"good",late:"warn",makeup:"info",missed:"bad",nocontent:""};
const ST_LABEL={planned:"stPlanned",upcoming:"stUpcoming",today:"stToday",ontime:"stOntime",late:"stLate",makeup:"stMakeup",missed:"stMissed",nocontent:"stNoContent"};
function maybeComplete(sid){
  const x=slotOf(sid);if(!x||P.done[x.key])return;
  if(slotParts(x).every(Boolean)){P.done[x.key]=new Date().toISOString();save();sync("complete",{session:x.title,date:x.date,actual:today()});setTimeout(()=>toast(t("completedT")),300)}
  else if(x.ls.length>1&&partsOf(sid).every(Boolean))setTimeout(()=>toast(t("lessonDoneMore")),300);
}
function monthStats(ym){
  const td=today();const sl=SLOTS.filter(x=>x.date.slice(0,7)===ym);
  const due=sl.filter(x=>x.date<=td);let studied=0,mk=0,missed=0;
  sl.forEach(x=>{const i=slotInfo(x);if(i.counted)studied++;if(i.mkOn)mk++;if(!i.counted&&x.date<=td&&x.ls.length&&x.date!==td)missed++});
  return{total:sl.length,due:due.length,studied,mk,missed,sl};
}

let voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en[-_]US/i.test(v.lang)&&/Samantha|Google|Natural|Aria|Jenny/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}catch(e){}}

const CONTR={"i'm":"i am","you're":"you are","we're":"we are","they're":"they are","he's":"he is","she's":"she is","it's":"it is","that's":"that is","there's":"there is","what's":"what is","i've":"i have","you've":"you have","we've":"we have","they've":"they have","i'll":"i will","you'll":"you will","we'll":"we will","i'd":"i would","don't":"do not","doesn't":"does not","didn't":"did not","can't":"cannot","won't":"will not","isn't":"is not","aren't":"are not","wasn't":"was not","haven't":"have not","hasn't":"has not","couldn't":"could not","shouldn't":"should not","let's":"let us"};
function words(s){return String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9' ]+/g," ").split(/\s+/).filter(Boolean).flatMap(w=>(CONTR[w]||w).split(" ")).map(w=>w.replace(/^'+|'+$/g,"").replace(/'s$/,"s").replace(/s'$/,"s")).filter(Boolean)}
function compare(target,heard){
  const a=words(target),b=words(heard),n=a.length,m=b.length;
  const L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const hit=new Array(n).fill(false);let i=0,j=0;
  while(i<n&&j<m){if(a[i]===b[j]){hit[i]=true;i++;j++}else if(L[i+1][j]>=L[i][j+1])i++;else j++}
  const matched=hit.filter(Boolean).length,extra=Math.max(0,m-matched);
  return{score:n?Math.max(0,Math.round(100*matched/n-4*Math.min(extra,5))):0,hit,tw:a};
}
const REC=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
function startRec(){
  const s=S.session;if(!REC){s.noMic=true;render();return}
  try{
    rec=new REC();rec.lang="en-US";rec.interimResults=true;rec.continuous=true;rec.maxAlternatives=1;
    s.heard="";s.partial="";s.result=null;
    rec.onresult=e=>{let fin="",part="";for(let i=0;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)fin+=r[0].transcript+" ";else part+=r[0].transcript}s.heard=fin.trim();s.partial=part;paintHeard()};
    rec.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"||e.error==="audio-capture")s.noMic=true;s.mic=false;rec=null;render()};
    rec.onend=()=>{const was=s.mic;s.mic=false;rec=null;const txt=(s.heard+" "+(s.partial||"")).trim();if(txt&&s.result==null){s.heard=txt;scoreSpeak()}else if(was)render()};
    rec.start();s.mic=true;render();
  }catch(e){s.noMic=true;render()}
}
function stopRec(){if(rec){try{rec.stop()}catch(e){}}}
function paintHeard(){const el=$("#heardLive"),s=S.session;if(el&&s)el.textContent=(s.heard+" "+(s.partial||"")).trim()||"…"}
function scoreSpeak(){const s=S.session;const p=s.items[s.idx];const c=compare(p.en,s.heard);s.result=c;s.best[s.idx]=Math.max(s.best[s.idx]??0,c.score);render()}

function inl(x){return esc(x).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\s->\s/g," → ")}
function pairHtml(a,b){
  const la=a.toLowerCase(),lb=b.toLowerCase();let p=0;while(p<la.length&&p<lb.length&&la[p]===lb[p])p++;
  if(p<2)p=0;
  return`<span class="pair"><span>${esc(a)}</span><span class="to">→</span><span>${esc(b.slice(0,p))}<span class="sfx">${esc(b.slice(p))}</span></span><button class="say" data-act="say" data-t="${esc(b)}" aria-label="${esc(t("listen"))} ${esc(b)}">▶</button></span>`;
}
function nodeText(txt){
  const tt=txt.trim().replace(/^-\s+/,"");txt=tt;
  const tri=/^([A-Za-z]+) - ([A-Za-z]+) - ([A-Za-z]+)$/.exec(tt);
  if(tri)return`<span class="pair">${[1,2,3].map(k=>`<span class="${k>1?"sfx":""}">${esc(tri[k])}</span>`).join('<span class="to">·</span>')}<button class="say" data-act="say" data-t="${esc(tri[1]+", "+tri[2]+", "+tri[3])}" aria-label="${esc(t("listen"))}">▶</button></span>`;
  const m=/^([A-Za-z][A-Za-z' ]{0,30}?)\s*(?:->|→)\s*([A-Za-z][A-Za-z' ]{0,30})$/.exec(tt);
  if(m)return pairHtml(m[1].trim(),m[2].trim());
  const ex=/^(Ví dụ|Example)s?:\s*(.+)$/i.exec(tt);
  if(ex)return`<span class="muted">${esc(ex[1])}:</span> `+ex[2].split(",").map(w=>w.trim()).filter(Boolean).map(w=>`<button class="wchip" data-act="say" data-t="${esc(w)}">${esc(w)}</button>`).join("");
  const sv=/^([A-Z][^()]*?[.!?])\s*(\(.+\))$/.exec(tt);
  if(sv)return`<span>${inl(sv[1])}</span> <span class="muted">${inl(sv[2])}</span><button class="say" data-act="say" data-t="${esc(sv[1])}" aria-label="${esc(t("listen"))}">▶</button>`;
  if(/^[A-Z][A-Za-z' ,.!?]+$/.test(tt)&&/\s/.test(tt))return`<span>${inl(tt)}</span><button class="say" data-act="say" data-t="${esc(tt)}" aria-label="${esc(t("listen"))}">▶</button>`;
  return`<span>${inl(txt)}</span>`;
}
function nodeHtml(n,path){
  if(typeof n==="string")n={t:n};

/* ---------- study sessions ---------- */
function pick(pool,mix){
  const out=[];const used=new Set();
  mix.forEach(([lv,n])=>{shuffle(pool.filter(x=>(x.lv||1)===lv)).slice(0,n).forEach(x=>{out.push(x);used.add(x)})});
  const want=mix.reduce((a,[,n])=>a+n,0);
  if(out.length<want)shuffle(pool.filter(x=>!used.has(x))).slice(0,want-out.length).forEach(x=>out.push(x));
  return out.sort((a,b)=>(a.lv||1)-(b.lv||1));
}

  const lv={};items.forEach(q=>{const l=q.lv||1;lv[l]=lv[l]||{n:0,ok:0};lv[l].n++});
  S.session={kind:"quiz",sid:id,title:s.title,items,idx:0,ans:null,score:0,wrong:[],lv,active:true};S.view={name:"quizRun"};render();scrollTo(0,0)}
function startSpeak(id){const s=SESS.find(z=>z.id===id);S.session={kind:"speak",sid:id,title:s.title,items:pick(s.speak||[],SPEAK_MIX),idx:0,heard:"",partial:"",result:null,best:[],mic:false,noMic:!REC,active:true};S.view={name:"speakRun"};render();scrollTo(0,0)}

  const byId={};vs.forEach(v=>byId[v.id]=v);
  if(every){S.session={kind:"cards",pool:vs,title:t("starred"),byId,queue:shuffle(vs.map(v=>v.id)).slice(0,40),reviewed:0,lapses:0,flipped:false,empty:!vs.length,active:true,hist:[]};S.view={name:"cards"};render();scrollTo(0,0);return}
  const due=shuffle(vs.filter(v=>all?P.vs[v.id]:isDue(v)).map(v=>v.id)).slice(0,40);const fresh=vs.filter(v=>!P.vs[v.id]).map(v=>v.id).slice(0,20);
  const q=all&&!due.length?shuffle(vs.map(v=>v.id)).slice(0,40):due.concat(fresh);const src=SOURCES.find(z=>z.id===S.vfilter);
  S.session={kind:"cards",pool:vs,title:src?src.title:t("vocab"),byId,queue:q,reviewed:0,lapses:0,flipped:false,empty:!q.length,active:true,hist:[]};S.view={name:"cards"};render();scrollTo(0,0)}
function checkAns(q,given){const n=x=>String(x).toLowerCase().replace(/[’‘`]/g,"'").trim().replace(/[.!?,;]+$/,"").replace(/\s+/g," ").trim();return q.a.split("/").some(a=>n(a)===n(given))}

document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="vfilter"){S.vfilter=el.value;S.vletter="";S.vlimit=60;render();return}
  if(el.dataset.mk){const k=el.dataset.mk;const cur=P.makeup[k]||{};if(!cur.date){el.checked=false;return}P.makeup[k]={on:el.checked,date:cur.date};save();pushAdmin();
    const x=SLOTS.find(z=>z.key===k);if(el.checked)sync("makeup",{session:x&&x.ls.length?x.title:k,date:x?x.date:k,makeupDate:P.makeup[k].date});render();return}
  if(el.dataset.mkd){const k=el.dataset.mkd;if(!el.value){delete P.makeup[k];save();pushAdmin();render();return}
    const sx=SLOTS.find(z=>z.key===k);if(sx&&el.value<=sx.date){toast(t("mkAfter",fmtDate(sx.date)));el.value=(P.makeup[k]&&P.makeup[k].date)||"";return}
    const cur=P.makeup[k]||{};P.makeup[k]={on:!!cur.on&&el.value<=today(),date:el.value};save();pushAdmin();render()}
});
document.addEventListener("submit",e=>{
  const f=e.target.dataset.form;if(!f)return;e.preventDefault();
  if(f==="fill")answer($("#fillInput").value);
  else if(f==="who"){if(TEACH.as)return;const n=$("#whoName").value.trim();if(!n)return;
    if(lidOf(n)!==P.lid)switchLearner(n);else{P.name=n;LS.set(KEY,P)}toast("✓");render();pull()}
  else if(f==="tlink"){const n=$("#tlinkName").value.trim();if(!n)return;S.newLink=learnerLink(n);render();copyText(S.newLink)}
  else if(f==="tlogin"){const k=$("#tkey").value.trim();if(!k)return;TEACH.key=k;LS.set("tkey",k);TEACH.on=true;loadLearners()}
});
if(TEACH.on&&SYNC){if(location.hash==="#giaovien")S.view={name:"teacher"};if(TEACH.key)loadLearners()}
render();
if(!TEACH.on||!TEACH.key)pull();
})();
</script>
</body>
</html>
